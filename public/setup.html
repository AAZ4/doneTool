<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>done – Einrichtung</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    main { padding: 16px 0 64px; }
    h1 { font-size: clamp(30px, 5vw, 44px); }
    .grid { display: grid; gap: 16px; margin-top: 24px; }
    @media (min-width: 860px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .box { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
    .box h2 { font-size: 20px; margin: 0; }
    .box img { width: 100%; max-width: 220px; aspect-ratio: 1; align-self: center; background: #fff; border-radius: 12px; padding: 8px; }
    .link { font-family: var(--mono); font-size: 13px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; word-break: break-all; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .warn { background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 14px 16px; font-weight: 600; margin-top: 8px; }

    /* Printable counter sticker */
    #sticker { display: none; }
    @media print {
      body { background: #fff; }
      .wrap > *:not(#sticker) { display: none !important; }
      #sticker { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; color: #000; padding-top: 40px; font-family: var(--font); }
      #sticker h2 { font-size: 34px; margin: 0; }
      #sticker img { width: 300px; height: 300px; }
      #sticker ol { text-align: left; font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar"><a class="logo" href="/" data-logo></a></header>

    <main id="main">
      <p class="muted" id="loading">Lade …</p>
    </main>

    <div id="sticker"></div>
  </div>

  <script src="/common.js"></script>
  <script>
    (async () => {
      const slug = slugFromPath();
      const token = tokenFromHash() || (store(`done.staff.${slug}`) || {}).token;
      const main = document.getElementById('main');
      let state;
      try {
        state = await api(`/api/r/${encodeURIComponent(slug)}/staff`, { headers: { 'x-staff-token': token } });
      } catch {
        main.innerHTML = '<h1>Kein Zugriff</h1><p class="muted">Dieser Einrichtungs-Link ist ungültig.</p>';
        return;
      }
      store(`done.staff.${slug}`, { token, name: state.restaurant.name });

      const origin = location.origin;
      const cashierUrl = `${origin}/k/${slug}#t=${token}`;
      const tvUrl = `${origin}/tv/${slug}#t=${token}`;
      const guestUrl = `${origin}/r/${slug}?k=${state.stickerKey}`;
      const name = escapeHtml(state.restaurant.name);

      main.innerHTML = `
        <h1>${name} ist bereit 🎉</h1>
        <p class="muted">Drei Dinge, dann kann es losgehen. Speichere diese Seite als Lesezeichen.</p>
        <div class="warn">Wer den Kassen- oder TV-Link hat, kann deine Bestellungen steuern. Gib ihn nur an dein Team weiter.</div>
        <div class="grid">
          <section class="card box">
            <h2>1 · Kasse</h2>
            <p class="muted small">Öffne diesen Link auf dem Handy oder Tablet an der Kasse. Scanne dafür einfach den Code.</p>
            <img src="${qrSrc(cashierUrl)}" alt="QR-Code für den Kassen-Link">
            <div class="link">${escapeHtml(cashierUrl)}</div>
            <div class="row">
              <a class="btn btn-accent btn-small" href="${cashierUrl}" target="_blank" rel="noopener">Kasse öffnen</a>
              <button class="btn btn-ghost btn-small" data-copy="${escapeHtml(cashierUrl)}">Link kopieren</button>
            </div>
          </section>
          <section class="card box">
            <h2>2 · QR-Code für die Theke</h2>
            <p class="muted small">Drucke ihn aus und klebe ihn an die Theke. Gäste scannen ihn nach dem Bezahlen.</p>
            <img src="${qrSrc(guestUrl)}" alt="QR-Code für Gäste">
            <div class="row">
              <button class="btn btn-small" id="print">Aufkleber drucken</button>
              <a class="btn btn-ghost btn-small" href="${guestUrl}" target="_blank" rel="noopener">Als Gast testen</a>
            </div>
          </section>
          <section class="card box">
            <h2>3 · Fernseher (optional)</h2>
            <p class="muted small">Zeigt fertige Nummern, sagt sie laut an und zeigt einen QR-Code, der sich jede Minute erneuert.</p>
            <img src="${qrSrc(tvUrl)}" alt="QR-Code für die TV-Anzeige">
            <div class="row">
              <a class="btn btn-small" href="${tvUrl}" target="_blank" rel="noopener">TV-Anzeige öffnen</a>
              <button class="btn btn-ghost btn-small" data-copy="${escapeHtml(tvUrl)}">Link kopieren</button>
            </div>
          </section>
        </div>`;

      document.getElementById('sticker').innerHTML = `
        <div class="logo" style="font-size:28px">${logoHtml()}</div>
        <h2>Wir rufen dich aufs Handy</h2>
        <img src="${qrSrc(guestUrl)}" alt="">
        <ol><li>Code scannen</li><li>„Benachrichtigung aktivieren“ tippen</li><li>Platz nehmen – dein Handy klingelt, wenn's fertig ist</li></ol>
        <div>${name} · Keine App nötig</div>`;

      document.getElementById('print').onclick = () => window.print();
      main.querySelectorAll('[data-copy]').forEach((b) => {
        b.onclick = async () => {
          await navigator.clipboard.writeText(b.dataset.copy);
          b.textContent = 'Kopiert ✓';
          setTimeout(() => { b.textContent = 'Link kopieren'; }, 1500);
        };
      });
    })();
  </script>
</body>
</html>
